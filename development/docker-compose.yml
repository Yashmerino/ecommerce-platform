version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ecommerce-server
      - payment-service
      - notification-service
      - ecommerce-ui
    networks:
      - ecommerce-network
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - ecommerce-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    depends_on:
      - ecommerce-server
      - payment-service
      - notification-service
    networks:
      - ecommerce-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    configs:
      - source: grafana-prometheus-datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana-dashboard-provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: grafana-ecommerce-dashboard
        target: /var/lib/grafana/dashboards/ecommerce-platform.json
    depends_on:
      - prometheus
    networks:
      - ecommerce-network
    restart: unless-stopped

  ecommerce-server:
    build:
      context: ../ecommerce-platform-server
      dockerfile: Dockerfile.dev
    container_name: ecommerce-server
    expose:
      - "8081"
    volumes:
      - ../ecommerce-platform-server/src:/app/src
      - ../ecommerce-platform-server/target:/app/target
      - maven-cache:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
      # Database
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/ecommerce_platform?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      # Swagger
      - SPRINGDOC_SWAGGER_UI_TAGS_SORTER=alpha
      # JWT
      - JWT_SECRET=YOUR_JWT_SECRET
      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=main-server
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES=com.yashmerino.ecommerce.kafka.events
      # Redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # CORS
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:8080,http://host.docker.internal:8080
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - ecommerce-network

  payment-service:
    build:
      context: ../ecommerce-platform-payment-service
      dockerfile: Dockerfile.dev
    container_name: payment-service
    expose:
      - "8082"
    volumes:
      - ../ecommerce-platform-payment-service/src:/app/src
      - ../ecommerce-platform-payment-service/target:/app/target
      - maven-cache:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
      # Database
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/ecommerce_platform_payment_service?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      # Swagger
      - SPRINGDOC_SWAGGER_UI_TAGS_SORTER=alpha
      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=payment-service
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER=org.apache.kafka.common.serialization.StringDeserializer
      - SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER=org.springframework.kafka.support.serializer.JsonDeserializer
      - SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES=com.yashmerino.ecommerce.kafka.events
      - SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TYPE_MAPPING=PaymentRequestedEvent:com.yashmerino.ecommerce.kafka.events.PaymentRequestedEvent
      - SPRING_KAFKA_PRODUCER_KEY_SERIALIZER=org.apache.kafka.common.serialization.StringSerializer
      - SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER=org.springframework.kafka.support.serializer.JsonSerializer
      # Stripe
      - STRIPE_API_KEY=YOUR_STRIPE_KEY
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ecommerce-network

  notification-service:
    build:
      context: ../ecommerce-platform-notification-service
      dockerfile: Dockerfile.dev
    container_name: notification-service
    expose:
      - "8083"
    volumes:
      - ../ecommerce-platform-notification-service/src:/app/src
      - ../ecommerce-platform-notification-service/target:/app/target
      - maven-cache:/root/.m2
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=true
      # Database
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/ecommerce_platform_notification_service?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_LOCATIONS=classpath:db/migration
      # Swagger
      - SPRINGDOC_SWAGGER_UI_TAGS_SORTER=alpha
      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=notification-service
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES=com.yashmerino.ecommerce.kafka.events
      # Mail
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=YOUR_EMAIL@gmail.com
      - SPRING_MAIL_PASSWORD=YOUR_EMAIL_PASSWORD
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
    depends_on:
      kafka:
        condition: service_started
    networks:
      - ecommerce-network

  ecommerce-ui:
    build:
      context: ../ecommerce-platform-ui
      dockerfile: Dockerfile.dev
    container_name: ecommerce-ui
    expose:
      - "8080"
    volumes:
      - ../ecommerce-platform-ui/src:/app/src
      - ../ecommerce-platform-ui/public:/app/public
      - ../ecommerce-platform-ui/index.html:/app/index.html
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - ecommerce-server
    networks:
      - ecommerce-network

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: ecommerce-server
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: [ecommerce-server:8081]

        - job_name: payment-service
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: [payment-service:8082]

        - job_name: notification-service
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: [notification-service:8083]

  grafana-prometheus-datasource:
    content: |
      apiVersion: 1

      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false

  grafana-dashboard-provider:
    content: |
      apiVersion: 1

      providers:
        - name: Ecommerce Platform
          orgId: 1
          folder: Ecommerce Platform
          type: file
          disableDeletion: false
          editable: true
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards

  grafana-ecommerce-dashboard:
    content: |
      {
        "annotations": { "list": [] },
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 0,
        "id": null,
        "links": [],
        "panels": [
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
            "id": 1,
            "options": {
              "legend": { "displayMode": "list", "placement": "bottom" },
              "tooltip": { "mode": "multi" }
            },
            "targets": [
              { "expr": "sum by (job) (rate(http_server_requests_seconds_count[5m]))", "legendFormat": "{{job}}", "refId": "A" }
            ],
            "title": "HTTP requests per second",
            "type": "timeseries"
          },
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "unit": "B" }, "overrides": [] },
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
            "id": 2,
            "options": {
              "legend": { "displayMode": "list", "placement": "bottom" },
              "tooltip": { "mode": "multi" }
            },
            "targets": [
              { "expr": "sum by (job) (jvm_memory_used_bytes{area=\"heap\"})", "legendFormat": "{{job}}", "refId": "A" }
            ],
            "title": "JVM heap used",
            "type": "timeseries"
          },
          {
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
            "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
            "id": 3,
            "options": {
              "legend": { "displayMode": "list", "placement": "bottom" },
              "tooltip": { "mode": "multi" }
            },
            "targets": [
              { "expr": "sum by (job) (rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))", "legendFormat": "{{job}}", "refId": "A" }
            ],
            "title": "HTTP 5xx responses per second",
            "type": "timeseries"
          }
        ],
        "refresh": "15s",
        "schemaVersion": 39,
        "tags": ["ecommerce", "spring-boot"],
        "time": { "from": "now-1h", "to": "now" },
        "timepicker": {},
        "timezone": "browser",
        "title": "Ecommerce Platform",
        "uid": "ecommerce-platform",
        "version": 1
      }

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql-data:
  maven-cache:
  prometheus-data:
  grafana-data:
